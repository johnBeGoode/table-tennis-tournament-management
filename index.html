<!DOCTYPE html>
<!-- @dsCard group="UI Kit — Tournament" name="ERTT Tournament App UI Kit" subtitle="App de gestion de tournois — joueurs, brackets, saisie résultats" viewport="1280x700" -->
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ERTT — App Tournois</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Roboto', sans-serif; overflow: hidden; }
    input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
    input[type=number] { -moz-appearance: textfield; }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="AppShell.jsx?v=42"></script>
<script type="text/babel" src="PoolsScreen.jsx?v=22"></script>
<script type="text/babel" src="BracketsScreen.jsx?v=21"></script>
<script type="text/babel" src="ResultsScreen.jsx?v=15"></script>
<script type="text/babel" src="KnockoutScreen.jsx?v=7"></script>
<script type="text/babel" src="QualificationScreen.jsx?v=4"></script>
<script type="text/babel" src="ConsolanteScreen.jsx?v=28"></script>

<script type="text/babel">
const DEFAULT_SCREEN = /*EDITMODE-BEGIN*/"consolante"/*EDITMODE-END*/;

// Look unique : Classique (la bascule de thème a été retirée)
const THEME = 'classique';

// Accès localStorage — helpers partagés (AppShell.jsx), les écrans les utilisent aussi
const { loadState, saveState } = window;

// Au démarrage de l'application, Résultats et Classements repartent toujours de
// « À jouer » et « Poules ». Le sous-onglet consulté reste mémorisé pendant la
// session (aller-retour entre écrans), mais pas d'un chargement de page à l'autre.
window.resetTabPreferences();

const App = () => {
  const theme = THEME;
  // L'écran « Barrages » est devenu « Informations » (id `qualification`) : un ancien id mémorisé y renvoie.
  const [screen, setScreen] = React.useState(() => {
    const saved = loadState('ertt-screen', DEFAULT_SCREEN);
    return saved === 'barrage' ? 'qualification' : saved;
  });
  React.useEffect(() => { saveState('ertt-screen', screen); }, [screen]);

  // Mode test : masque/affiche les boutons de données factices (« Joueurs de test »,
  // « Générer les scores »). Jamais persisté — chaque chargement de page repart éteint.
  const [testMode, setTestMode] = React.useState(false);

  // Shared state
  // Migration : les joueurs sans points (non classés d'avant le plancher) ou sous
  // 500 sont remontés à 500 — plus personne n'est « sans points ».
  const [players, setPlayers] = React.useState(() => loadState('ertt-players', [])
    .map(p => ({ ...p, ranking: window.normalizeRanking(p.ranking) })));
  const [pools, setPools] = React.useState(() => loadState('ertt-pools', []));
  const [results, setResults] = React.useState(() => {
    const raw = loadState('ertt-results', {});
    // Migration : clés canoniques (petit id de joueur en premier).
    // Les résultats enregistrés avant la canonicalisation sont réécrits,
    // en inversant l'orientation des sets si la paire était inversée.
    const migrated = {};
    Object.entries(raw).forEach(([k, v]) => {
      const m = k.match(/^pool-(\d+)-(\d+)-(\d+)$/);
      if (m && parseInt(m[2]) > parseInt(m[3])) {
        migrated[`pool-${m[1]}-${m[3]}-${m[2]}`] = { ...v, sets: (v.sets || []).map(([a, b]) => [b, a]) };
      } else {
        migrated[k] = v;
      }
    });
    return migrated;
  });
  // Migration one-shot des résultats de tableau (clé `ertt-bracket-schema`) :
  //   2 : le mode 'byes' a remplacé 'eliminate' — purge si le tournoi est en mode 'byes'
  //       (autre taille de tableau, autre consolante) ;
  //   3 : nouvelles tables de placement 8/16/32 et 2es placés en moitié opposée de leur
  //       1er — les ids `principal-r1-N` ne désignent plus les mêmes joueurs, purge
  //       dans tous les modes (le placement consolante est jeté par sa clé v5).
  //   4 : plus de barrages, les meilleurs 3es complètent le tableau (mode 'thirds') ;
  //       la clé `ertt-barrage-results` est supprimée.
  //   5 : le repêchage des 3es est restreint au trou de 2 places — de 6 et 11 à 14
  //       poules, le tableau repasse aux exemptions de 1er tour.
  //   6 : en mode 'byes', les exemptions vont aux meilleures TS — le placement change
  //       (slots vides = partenaires des slots 1..byeCount), sans que la taille bouge.
  // Sans purge, buildIntegralBracket propagerait les copies de joueurs des anciens
  // résultats dans un tableau qui ne les contient plus à ces positions.
  const BRACKET_SCHEMA = 6;
  const [bracketResults, setBracketResults] = React.useState(() => {
    const raw = loadState('ertt-bracket-results', {});
    const schema = loadState('ertt-bracket-schema', 1);
    if (schema >= BRACKET_SCHEMA) return raw;
    // Avant le schéma 3, les tables de placement elles-mêmes ont changé : rien n'est
    // récupérable, quel que soit le régime.
    if (schema < 3) return {};
    // Depuis, seule change la façon de combler les places manquantes. C'est elle qui
    // détermine QUI occupe les slots, donc la validité des résultats enregistrés : on
    // ne purge que si le régime du tournoi courant n'est plus celui de son schéma.
    const thirdsCount = pools.filter(p => (p.playerIds || []).length >= 3).length;
    const missing = window.buildPrincipalSeeds({ pools, players, results }).bracketSize - pools.length * 2;
    const regime = (v) => {
      if (missing === 0) return 'direct';
      if (v <= 3) return missing * 2 <= thirdsCount ? 'barrage' : 'byes';
      if (v === 4) return missing <= thirdsCount ? 'thirds' : 'byes';
      return missing === 2 && thirdsCount >= 2 ? 'thirds' : 'byes';
    };
    if (regime(schema) !== regime(BRACKET_SCHEMA)) return {};
    // 5 → 6 : à régime 'byes' inchangé, le placement a pu changer — les exemptions vont
    // désormais aux meilleures TS. Deux causes, il suffit de l'une :
    //   • on vide maintenant les partenaires des slots 1..byeCount et non les derniers
    //     slots du pattern (identique sur un tableau de 16, différent sur 32) ;
    //   • s'il y a plus d'exemptions que de poules, un 2e est exempté et choisit son
    //     slot avant les 1ers, ce qui déplace aussi ces derniers.
    // Quand aucune des deux ne joue (6 et 12 poules), le placement est bit à bit le même
    // et les résultats restent valables : inutile de les jeter.
    if (schema < 6 && regime(BRACKET_SCHEMA) === 'byes') {
      const B = window.buildPrincipalSeeds({ pools, players, results }).bracketSize;
      const byeCount = B - pools.length * 2;
      const avant = Array.from({ length: byeCount }, (_, i) => B - i).sort((a, b) => a - b);
      const apres = Array.from({ length: byeCount }, (_, i) => window.firstRoundOpponent(B, i + 1)).sort((a, b) => a - b);
      const memesVides = JSON.stringify(avant) === JSON.stringify(apres);
      if (!memesVides || byeCount > pools.length) return {};
    }
    return raw;
  });
  React.useEffect(() => {
    saveState('ertt-bracket-schema', BRACKET_SCHEMA);
    try { localStorage.removeItem('ertt-barrage-results'); } catch {}
  }, []);
  const [setsToWin, setSetsToWin] = React.useState(() => loadState('ertt-sets-to-win', 3));
  // Tables attribuées aux matchs en cours, `{ [matchId]: numéro }` — un seul jeu de
  // tables pour le tableau principal et la consolante (AppShell : TABLE_COUNT).
  const [tables, setTables] = React.useState(() => loadState('ertt-tables', {}));
  // Verrou des poules : posé par la répartition auto, levé uniquement par
  // « Déverrouiller » (PoolsScreen, confirmé), « Réinitialiser » ou « Joueurs de test ».
  const [poolsLocked, setPoolsLocked] = React.useState(() => loadState('ertt-pools-locked', false));

  // Persist shared state
  React.useEffect(() => { saveState('ertt-players', players); }, [players]);
  React.useEffect(() => { saveState('ertt-pools', pools); }, [pools]);
  React.useEffect(() => { saveState('ertt-results', results); }, [results]);
  React.useEffect(() => { saveState('ertt-bracket-results', bracketResults); }, [bracketResults]);
  React.useEffect(() => { saveState('ertt-sets-to-win', setsToWin); }, [setsToWin]);
  React.useEffect(() => { saveState('ertt-pools-locked', poolsLocked); }, [poolsLocked]);
  React.useEffect(() => { saveState('ertt-tables', tables); }, [tables]);

  // Purge des résultats orphelins : quand la composition des poules change
  // (joueur retiré, poule supprimée…), les résultats des paires qui n'existent
  // plus sont supprimés — le verrou de format se libère alors automatiquement.
  React.useEffect(() => {
    const valid = new Set();
    pools.forEach(pool => {
      const ids = pool.playerIds;
      for (let i = 0; i < ids.length; i++)
        for (let j = i + 1; j < ids.length; j++)
          valid.add(window.poolMatchKey(pool.id, ids[i], ids[j]));
    });
    setResults(prev => {
      const stale = Object.keys(prev).filter(k => k.startsWith('pool-') && !valid.has(k));
      if (stale.length === 0) return prev;
      const next = { ...prev };
      stale.forEach(k => delete next[k]);
      return next;
    });
  }, [pools]);

  // Une table se libère dès que le match a un score : le match est terminé, il rend
  // sa table. Piloté ici plutôt que dans les écrans pour couvrir d'un coup toutes les
  // façons d'enregistrer un résultat (saisie, « Générer les scores », les deux tableaux).
  React.useEffect(() => {
    setTables(prev => {
      const done = Object.keys(prev).filter(id => bracketResults[id]);
      if (done.length === 0) return prev;
      const next = { ...prev };
      done.forEach(id => { delete next[id]; });
      return next;
    });
  }, [bracketResults]);

  const handleScreen = (v) => setScreen(v);

  const resetAll = () => {
    setPlayers([]);
    setPools([]);
    setResults({});
    setBracketResults({});
    setPoolsLocked(false);
    setTables({});
    // Écrite hors de l'état d'App par ConsolanteScreen : à purger à la main
    window.clearConsolanteSeeds();
  };

  // Données de test : repart d'un tournoi vierge avec `count` joueurs générés.
  const seedPlayers = (count) => {
    setPlayers(window.randomPlayers(count));
    setPools([]);
    setResults({});
    setBracketResults({});
    setPoolsLocked(false);
    setTables({});
    window.clearConsolanteSeeds();
    setScreen('poules');
  };

  const screenMap = {
    poules:     <PoolsScreen    theme={theme} players={players} pools={pools} results={results} setsToWin={setsToWin} onUpdateSetsToWin={setSetsToWin} onUpdatePlayers={setPlayers} onUpdatePools={setPools} poolsLocked={poolsLocked} onUpdatePoolsLocked={setPoolsLocked} />,
    brackets:   <BracketsScreen theme={theme} players={players} pools={pools} results={results} bracketResults={bracketResults} />,
    resultats:  <ResultsScreen  theme={theme} players={players} pools={pools} results={results} setsToWin={setsToWin} onUpdateResults={setResults} testMode={testMode} />,
    qualification: <QualificationScreen theme={theme} players={players} pools={pools} results={results} />,
    principal:  <KnockoutScreen theme={theme} players={players} pools={pools} results={results} bracketResults={bracketResults} onUpdateBracketResults={setBracketResults} tables={tables} onUpdateTables={setTables} testMode={testMode} />,
    consolante: <ConsolanteScreen theme={theme} players={players} pools={pools} results={results} bracketResults={bracketResults} onUpdateBracketResults={setBracketResults} tables={tables} onUpdateTables={setTables} testMode={testMode} />,
  };

  return (
    <AppShell theme={theme} screen={screen} onNav={handleScreen} tournamentName="Tournoi Amical Printemps 2026" onResetAll={resetAll} onSeedPlayers={seedPlayers}
      testMode={testMode} onToggleTestMode={() => setTestMode(v => !v)}>
      {screenMap[screen]}
    </AppShell>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
