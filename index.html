<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ERTT — App Tournois</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Roboto', sans-serif; overflow: hidden; }
    input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
    input[type=number] { -moz-appearance: textfield; }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="AppShell.jsx?v=47"></script>
<script type="text/babel" src="PoolsScreen.jsx?v=24"></script>
<script type="text/babel" src="BracketsScreen.jsx?v=27"></script>
<script type="text/babel" src="ResultsScreen.jsx?v=18"></script>
<script type="text/babel" src="KnockoutScreen.jsx?v=8"></script>
<script type="text/babel" src="QualificationScreen.jsx?v=5"></script>
<script type="text/babel" src="ConsolanteScreen.jsx?v=32"></script>

<script type="text/babel">
const DEFAULT_SCREEN = 'poules';

// Accès localStorage — helpers partagés (AppShell.jsx), les écrans les utilisent aussi
const { loadState, saveState } = window;

// Au démarrage de l'application, Résultats et Classements repartent toujours de
// « À jouer » et « Poules ». Le sous-onglet consulté reste mémorisé pendant la
// session (aller-retour entre écrans), mais pas d'un chargement de page à l'autre.
window.resetTabPreferences();

const App = () => {
  const [screen, setScreen] = React.useState(() => loadState('ertt-screen', DEFAULT_SCREEN));
  React.useEffect(() => { saveState('ertt-screen', screen); }, [screen]);

  // Mode test : masque/affiche les boutons de données factices (« Joueurs de test »,
  // « Générer les scores »). Jamais persisté — chaque chargement de page repart éteint.
  const [testMode, setTestMode] = React.useState(false);

  // État partagé, rechargé depuis localStorage : un navigateur fermé en plein tournoi
  // reprend là où il en était.
  const [players, setPlayers] = React.useState(() => loadState('ertt-players', []));
  const [pools, setPools] = React.useState(() => loadState('ertt-pools', []));
  const [results, setResults] = React.useState(() => loadState('ertt-results', {}));
  const [bracketResults, setBracketResults] = React.useState(() => loadState('ertt-bracket-results', {}));
  const [setsToWin, setSetsToWin] = React.useState(() => loadState('ertt-sets-to-win', 3));
  // Tables attribuées aux matchs en cours, `{ [matchId]: numéro }` — un seul jeu de
  // tables pour le tableau principal et la consolante (AppShell : TABLE_COUNT).
  const [tables, setTables] = React.useState(() => loadState('ertt-tables', {}));
  // Verrou des poules : posé par la répartition auto, levé uniquement par
  // « Déverrouiller » (PoolsScreen, confirmé), « Réinitialiser » ou « Joueurs de test ».
  const [poolsLocked, setPoolsLocked] = React.useState(() => loadState('ertt-pools-locked', false));

  // Sauvegarde à chaque modification
  React.useEffect(() => { saveState('ertt-players', players); }, [players]);
  React.useEffect(() => { saveState('ertt-pools', pools); }, [pools]);
  React.useEffect(() => { saveState('ertt-results', results); }, [results]);
  React.useEffect(() => { saveState('ertt-bracket-results', bracketResults); }, [bracketResults]);
  React.useEffect(() => { saveState('ertt-sets-to-win', setsToWin); }, [setsToWin]);
  React.useEffect(() => { saveState('ertt-pools-locked', poolsLocked); }, [poolsLocked]);
  React.useEffect(() => { saveState('ertt-tables', tables); }, [tables]);

  // Purge des résultats orphelins : quand la composition des poules change
  // (joueur retiré, poule supprimée…), les résultats des paires qui n'existent
  // plus sont supprimés — le verrou de format se libère alors automatiquement.
  React.useEffect(() => {
    const valid = new Set();
    pools.forEach(pool => {
      const ids = pool.playerIds;
      for (let i = 0; i < ids.length; i++)
        for (let j = i + 1; j < ids.length; j++)
          valid.add(window.poolMatchKey(pool.id, ids[i], ids[j]));
    });
    setResults(prev => {
      const stale = Object.keys(prev).filter(k => k.startsWith('pool-') && !valid.has(k));
      if (stale.length === 0) return prev;
      const next = { ...prev };
      stale.forEach(k => delete next[k]);
      return next;
    });
  }, [pools]);

  // Une table se libère dès que le match a un score : le match est terminé, il rend
  // sa table. Piloté ici plutôt que dans les écrans pour couvrir d'un coup toutes les
  // façons d'enregistrer un résultat (saisie, « Générer les scores », les deux tableaux).
  React.useEffect(() => {
    setTables(prev => {
      const done = Object.keys(prev).filter(id => bracketResults[id]);
      if (done.length === 0) return prev;
      const next = { ...prev };
      done.forEach(id => { delete next[id]; });
      return next;
    });
  }, [bracketResults]);

  const resetAll = () => {
    setPlayers([]);
    setPools([]);
    setResults({});
    setBracketResults({});
    setPoolsLocked(false);
    setTables({});
    // Écrite hors de l'état d'App par ConsolanteScreen : à purger à la main
    window.clearConsolanteSeeds();
  };

  // Données de test : repart d'un tournoi vierge avec `count` joueurs générés.
  const seedPlayers = (count) => {
    setPlayers(window.randomPlayers(count));
    setPools([]);
    setResults({});
    setBracketResults({});
    setPoolsLocked(false);
    setTables({});
    window.clearConsolanteSeeds();
    setScreen('poules');
  };

  const screenMap = {
    poules:     <PoolsScreen    players={players} pools={pools} results={results} setsToWin={setsToWin} onUpdateSetsToWin={setSetsToWin} onUpdatePlayers={setPlayers} onUpdatePools={setPools} poolsLocked={poolsLocked} onUpdatePoolsLocked={setPoolsLocked} />,
    brackets:   <BracketsScreen players={players} pools={pools} results={results} bracketResults={bracketResults} />,
    resultats:  <ResultsScreen  players={players} pools={pools} results={results} setsToWin={setsToWin} onUpdateResults={setResults} testMode={testMode} />,
    qualification: <QualificationScreen players={players} pools={pools} results={results} />,
    principal:  <KnockoutScreen players={players} pools={pools} results={results} bracketResults={bracketResults} onUpdateBracketResults={setBracketResults} tables={tables} onUpdateTables={setTables} testMode={testMode} />,
    consolante: <ConsolanteScreen players={players} pools={pools} results={results} bracketResults={bracketResults} onUpdateBracketResults={setBracketResults} tables={tables} onUpdateTables={setTables} testMode={testMode} />,
  };

  return (
    <AppShell screen={screen} onNav={setScreen} onResetAll={resetAll} onSeedPlayers={seedPlayers}
      testMode={testMode} onToggleTestMode={() => setTestMode(v => !v)}>
      {screenMap[screen]}
    </AppShell>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
